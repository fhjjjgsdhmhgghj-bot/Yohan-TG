name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" 2>/dev/null || true

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Generate Gradle Wrapper
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.7/bin/gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK signed
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "APK: $APK"
          ls -lh "$APK"
          # Check for signature
          unzip -l "$APK" | grep -E "META-INF/.*\.(RSA|SF|MF)" || echo "WARNING: No signature entries found"
          # Re-sign with debug keystore if needed
          DEBUG_KS="$HOME/.android/debug.keystore"
          if [ ! -f "$DEBUG_KS" ]; then
            keytool -genkey -v -keystore "$DEBUG_KS" -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          # Always sign explicitly with apksigner or jarsigner
          if command -v apksigner >/dev/null 2>&1; then
            apksigner sign --ks "$DEBUG_KS" --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey "$APK"
          else
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore "$DEBUG_KS" -storepass android -keypass android \
              "$APK" androiddebugkey
          fi
          echo "=== After signing ==="
          unzip -l "$APK" | grep -E "META-INF/.*\.(RSA|SF|MF)" || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YohanTG-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
