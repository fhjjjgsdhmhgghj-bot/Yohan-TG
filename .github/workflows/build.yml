name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" 2>/dev/null || true

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Generate Gradle Wrapper
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.7/bin/gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Align and Sign APK
        run: |
          set -e
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "Original APK: $APK ($(du -h "$APK" | cut -f1))"
          
          BT="$ANDROID_HOME/build-tools/34.0.0"
          ZIPALIGN="$BT/zipalign"
          APKSIGNER="$BT/apksigner"
          
          DEBUG_KS="$HOME/.android/debug.keystore"
          mkdir -p "$HOME/.android"
          if [ ! -f "$DEBUG_KS" ]; then
            keytool -genkeypair -v -keystore "$DEBUG_KS" -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Strip existing signature then realign
          UNSIGNED="/tmp/app-unsigned.apk"
          ALIGNED="/tmp/app-aligned.apk"
          SIGNED="app/build/outputs/apk/debug/YohanTG.apk"
          
          # Remove old signature entries
          cp "$APK" "$UNSIGNED"
          zip -d "$UNSIGNED" 'META-INF/*' 2>/dev/null || true
          
          "$ZIPALIGN" -f -p 4 "$UNSIGNED" "$ALIGNED"
          
          "$APKSIGNER" sign \
            --ks "$DEBUG_KS" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$SIGNED" \
            "$ALIGNED"
          
          "$APKSIGNER" verify --verbose "$SIGNED"
          ls -lh "$SIGNED"
          echo "FINAL_APK=$SIGNED" >> $GITHUB_ENV

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YohanTG-debug
          path: app/build/outputs/apk/debug/YohanTG.apk
          retention-days: 14
          if-no-files-found: error
